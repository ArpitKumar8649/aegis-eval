[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-eval"
version = "0.1.0"
description = "Deterministic and LLM-as-a-judge evaluation harness for preventive health AI guidance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that require live LLM gateway access (skipped by default unless --live is specified)",
]
